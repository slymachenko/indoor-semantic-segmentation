[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semseg"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "h5py",
    "opencv",
]

[project.optional-dependencies]
dev = ["ipykernel", "ipywidgets"]

[tool.setuptools.packages.find]
where = ["src"]
