name: pixel_logreg_rgb
dataset_config_path: datasets/nyu_depth_v2.yaml
random_state: 42

sampling:
  strategy: pixel
  stride: 6
  with_position: false

task:
  type: binary_segmentation
  target_classes:
    - floor
    - floor mat
    - floor trim
  class_names:
    - not floor # 0 - not floor
    - floor # 1 - floor
  threshold: 0.5

model:
  name: logistic_regression
  params:
    class_weight: balanced
    max_iter: 1000

output:
  save_checkpoint: true
  save_predictions: true
